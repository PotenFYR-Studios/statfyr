name: Build Plugin

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Verify Java 8 bytecode
        shell: bash
        run: |
          JAR="$(ls build/libs/Statfyr-*.jar | grep -v sources | head -n1)"
          test -n "${JAR}"
          MAJOR="$(javap -verbose -cp "${JAR}" in.potenfyr.statfyr.util.JsonBuilder \
                    | awk '/major version/ {print $3}')"
          echo "Class file major version: ${MAJOR}"
          if [ "${MAJOR}" != "52" ]; then
            echo "Expected Java 8 (major 52) bytecode"; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Statfyr
          path: |
            build/libs/Statfyr-*.jar
            !build/libs/*-sources.jar
