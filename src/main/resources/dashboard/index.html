<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StatFYR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #171717;
    --bg-deep: #0f0f0f;
    --surface: #1c1c1c;
    --surface2: #232323;
    --border: #2e2e2e;
    --border-strong: #363636;
    --border-subtle: #242424;
    --text: #fafafa;
    --text2: #b4b4b4;
    --muted: #898989;
    --green: #3ecf8e;
    --green-link: #00c573;
    --green-border: rgba(62, 207, 142, 0.3);
    --gold: #facf5f;
    --mono: 'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  html.light {
    --bg: #fafafa;
    --bg-deep: #f0f0f0;
    --surface: #ffffff;
    --surface2: #f4f4f4;
    --border: #e0e0e0;
    --border-strong: #c9c9c9;
    --border-subtle: #ebebeb;
    --text: #171717;
    --text2: #444444;
    --muted: #898989;
    --green-border: rgba(0, 197, 115, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--green); color: #0f0f0f; }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 28px; border-bottom: 1px solid var(--border-subtle);
    background: var(--bg); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 24px; height: 24px; border-radius: 6px; background: var(--green);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border); border-radius: 9999px; padding: 5px 14px;
  }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .live.err .dot { background: #e5484d; }

  main { max-width: 1120px; margin: 0 auto; padding: 0 24px 80px; }

  .hero { padding: 68px 0 52px; }
  .hero .kicker {
    font-family: var(--mono); font-size: 12px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--green); margin-bottom: 18px;
  }
  .hero h2 {
    margin: 0 0 14px; font-size: clamp(38px, 7vw, 66px); font-weight: 400;
    line-height: 1.0; letter-spacing: -0.02em;
  }
  .hero p { margin: 0; color: var(--text2); font-size: 17px; max-width: 560px; }

  .strip {
    display: flex; gap: 0; border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; background: var(--bg-deep);
    flex-wrap: wrap;
  }
  .strip .cell {
    flex: 1 1 130px; padding: 18px 22px; border-right: 1px solid var(--border-subtle);
  }
  .strip .cell:last-child { border-right: none; }
  .strip .k {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
  }
  .strip .v { font-size: 26px; font-weight: 600; margin-top: 6px; }
  .strip .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }

  section { margin-top: 64px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .sec-head h3 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: -0.16px; }
  .sec-head .line { flex: 1; border-bottom: 1px solid var(--border-subtle); }
  .sec-head .tag {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
  }

  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .podium { grid-template-columns: 1fr; } }
  .podium .place {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px 24px; position: relative;
  }
  .podium .place.first { border-color: var(--green-border); }
  .podium .rank {
    font-family: var(--mono); font-size: 12px; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase;
  }
  .podium .place.first .rank { color: var(--green); }
  .podium .name { font-size: 20px; font-weight: 600; margin-top: 8px; }
  .podium .score { color: var(--text2); margin-top: 4px; font-size: 14px; }
  .podium .crown { position: absolute; top: 18px; right: 20px; font-size: 18px; }

  .board-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 13px 22px; border-bottom: 1px solid var(--border-subtle); }
  th {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted); font-weight: 500;
    background: var(--bg-deep);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rk { font-family: var(--mono); color: var(--muted); font-size: 13px; }
  tr.top1 .rk, tr.top2 .rk, tr.top3 .rk { color: var(--green); font-weight: 500; }
  .on-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 9px; }
  .on-dot.off { background: var(--border-strong); }

  .board-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  select {
    appearance: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 9999px;
    padding: 8px 18px; font: 500 13px var(--sans); outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--green-border); }

  .lookup { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .lookup input {
    flex: 1 1 280px; max-width: 420px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 9999px;
    padding: 11px 22px; font: 400 14px var(--sans); outline: none;
  }
  .lookup input::placeholder { color: var(--muted); }
  .lookup input:focus { border-color: var(--green-border); }
  .lookup button {
    background: var(--green); color: #0f0f0f; border: none; border-radius: 9999px;
    padding: 11px 28px; font: 600 14px var(--sans); cursor: pointer;
  }
  .lookup button:hover { filter: brightness(1.08); }

  .profile { display: none; }
  .profile.show { display: block; }
  .profile-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 30px;
  }
  .profile-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .profile-head .pname { font-size: 24px; font-weight: 600; letter-spacing: -0.16px; }
  .badge {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    border: 1px solid var(--border); border-radius: 9999px; padding: 4px 12px; color: var(--muted);
  }
  .badge.on { border-color: var(--green-border); color: var(--green-link); }
  .profile-sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stat {
    background: var(--bg-deep); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 14px 16px;
  }
  .stat .k {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
  }
  .stat .v { font-size: 21px; font-weight: 600; margin-top: 6px; }
  .fav-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .fav {
    flex: 1 1 180px; background: var(--bg-deep); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .fav .ico {
    width: 34px; height: 34px; border-radius: 8px; background: var(--surface2);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .fav .t { font-size: 11px; font-family: var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .fav .d { font-size: 14px; font-weight: 500; }
  .fav .d small { color: var(--muted); font-weight: 400; }

  .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
  }
  .pcard .top { display: flex; align-items: center; gap: 10px; }
  .pcard .nm { font-weight: 600; font-size: 15px; }
  .pcard .st {
    margin-left: auto; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--green-link);
  }
  .pcard .row { display: flex; justify-content: space-between; color: var(--text2); font-size: 13px; margin-top: 10px; }
  .pcard .row b { color: var(--text); font-weight: 500; }
  .empty { color: var(--muted); font-size: 14px; padding: 26px 0; text-align: center; }

  footer {
    border-top: 1px solid var(--border-subtle); margin-top: 80px;
    padding: 28px; text-align: center; color: var(--muted); font-size: 12px;
  }
  footer .mono { font-family: var(--mono); letter-spacing: 1.2px; text-transform: uppercase; }
  a { color: var(--green-link); text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <h1 id="brand-title">StatFYR</h1>
    <span class="sub" id="brand-sub"></span>
  </div>
  <span class="spacer"></span>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">connecting</span></span>
</header>

<main>
  <div class="hero">
    <div class="kicker" id="hero-kicker">Server stats</div>
    <h2 id="hero-line">The numbers behind<br />your server.</h2>
    <p id="hero-sub">Playtime, kills, builds and records, updated while you play.</p>
  </div>

  <div class="strip" id="strip"></div>

  <section id="sec-podium">
    <div class="sec-head">
      <h3>Hall of fame</h3>
      <span class="line"></span>
      <span class="tag">all time</span>
    </div>
    <div class="podium" id="podium"></div>
  </section>

  <section id="sec-board">
    <div class="sec-head">
      <h3>Leaderboards</h3>
      <span class="line"></span>
      <span class="tag" id="board-count"></span>
    </div>
    <div class="board-controls">
      <select id="metric">
        <option value="playtime">Playtime</option>
        <option value="kills">Kills</option>
        <option value="kdr">K/D ratio</option>
        <option value="blocks_mined">Blocks mined</option>
        <option value="items_crafted">Items crafted</option>
        <option value="sessions">Sessions</option>
        <option value="distance_traveled">Distance</option>
        <option value="player_kills">PvP kills</option>
        <option value="mob_kills">Mob kills</option>
      </select>
      <select id="period">
        <option value="all_time">All time</option>
        <option value="daily">Today</option>
        <option value="weekly">This week</option>
        <option value="monthly">This month</option>
      </select>
    </div>
    <div class="board-wrap">
      <table>
        <thead><tr><th style="width:70px">Rank</th><th>Player</th><th class="num">Value</th></tr></thead>
        <tbody id="board"><tr><td colspan="3" class="empty">Loading.</td></tr></tbody>
      </table>
    </div>
  </section>

  <section id="sec-lookup">
    <div class="sec-head">
      <h3>Look up a player</h3>
      <span class="line"></span>
      <span class="tag">detailed stats</span>
    </div>
    <div class="lookup">
      <input id="q" type="search" placeholder="Player name" />
      <button id="go">View stats</button>
    </div>
    <div class="profile" id="profile"></div>
  </section>

  <section id="sec-live">
    <div class="sec-head">
      <h3>Online right now</h3>
      <span class="line"></span>
      <span class="tag" id="live-count"></span>
    </div>
    <div class="live-grid" id="live-grid"></div>
  </section>
</main>

<footer>
  <span class="mono" id="foot-brand">StatFYR</span> &middot; powered by the StatFYR API &middot;
  <a href="/api/docs">API docs</a> &middot; <span id="foot-ver"></span>
</footer>

<script>
window.STATFYR_CONFIG = ${STATFYR_CONFIG};
</script>
<script>
(function () {
  "use strict";

  var CFG = window.STATFYR_CONFIG || {};

  function esc(v) {
    var d = document.createElement("div");
    d.textContent = v === undefined || v === null ? "" : String(v);
    return d.innerHTML;
  }
  function num(v) { return (v === undefined || v === null || isNaN(v)) ? "0" : Number(v).toLocaleString(); }
  function dur(s) {
    s = Math.round(Number(s) || 0);
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d > 0) return d + "d " + h + "h";
    if (h > 0) return h + "h " + m + "m";
    if (m > 0) return m + "m";
    return s + "s";
  }
  function prettyId(id) {
    if (!id) return "none yet";
    return String(id).replace("minecraft:", "").replace(/_/g, " ");
  }
  function prettyDate(iso) {
    if (!iso) return "unknown";
    try { return new Date(iso).toLocaleDateString(); } catch (e) { return iso; }
  }

  document.title = CFG.title || "StatFYR";
  document.getElementById("brand-title").textContent = CFG.title || "StatFYR";
  document.getElementById("brand-sub").textContent = CFG.subtitle || "";
  document.getElementById("foot-brand").textContent = CFG.title || "StatFYR";
  if (CFG.accent) {
    document.documentElement.style.setProperty("--green", CFG.accent);
    document.documentElement.style.setProperty("--green-link", CFG.accent);
    document.documentElement.style.setProperty("--green-border", CFG.accent + "4d");
  }
  ["podium", "board", "lookup", "live"].forEach(function (m) {
    if (CFG["module_" + m] === false) {
      var el = document.getElementById("sec-" + m);
      if (el) el.remove();
    }
  });

  var API = String(CFG.api_base || "").replace(/\/+$/, "");
  var REFRESH = Math.max(10, Number(CFG.refresh_seconds) || 30) * 1000;

  function api(path) {
    var h = {};
    if (CFG.api_key) h["Authorization"] = "Bearer " + CFG.api_key;
    return fetch(API + path, { headers: h }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function notError(d) { if (d && d.error) throw new Error(d.message || "failed"); return d; }

  function status(text, err) {
    document.getElementById("live-text").textContent = text;
    document.getElementById("live").classList.toggle("err", !!err);
  }

  function renderStrip(s) {
    document.getElementById("hero-line").innerHTML =
      esc(num(s.total_players)) + " players,<br />" + esc(dur(s.total_playtime_seconds)) + " played.";
    document.getElementById("strip").innerHTML = [
      { k: "Online now", v: num(s.online) },
      { k: "Unique today", v: num(s.unique_players_today) },
      { k: "Total players", v: num(s.total_players) },
      { k: "Sessions", v: num(s.sessions_total), small: (Number(s.sessions_per_day) || 0).toFixed(1) + "/day" },
      { k: "Avg session", v: dur(s.average_session_seconds) },
      { k: "Peak record", v: num(s.peak_all_time) }
    ].map(function (c) {
      return '<div class="cell"><div class="k">' + esc(c.k) + '</div>' +
             '<div class="v">' + c.v + (c.small ? "<small>" + esc(c.small) + "</small>" : "") + "</div></div>";
    }).join("");
  }

  var currentMetric = CFG.leaderboard_metric || "playtime";

  function fmtValue(e) {
    if (e.formatted !== undefined && e.formatted !== null) return e.formatted;
    return num(e.value);
  }

  function renderPodium(entries) {
    var el = document.getElementById("podium");
    if (!el) return;
    var medals = ["\uD83E\uDD47", "\uD83E\uDD48", "\uD83E\uDD49"];
    el.innerHTML = entries.slice(0, 3).map(function (e, i) {
      return '<div class="place' + (i === 0 ? " first" : "") + '">' +
             (i === 0 ? '<span class="crown">' + medals[0] + "</span>" : "") +
             '<div class="rank">' + (i === 0 ? "Champion" : "#" + (i + 1)) + "</div>" +
             '<div class="name">' + esc(e.name) + "</div>" +
             '<div class="score">' + esc(fmtValue(e)) + "</div></div>";
    }).join("") || '<div class="empty">No ranked players yet. Be the first.</div>';
  }

  function renderBoard(entries) {
    document.getElementById("board").innerHTML =
      entries.slice(0, 10).map(function (e, i) {
        return '<tr class="top' + (i + 1) + '" data-name="' + esc(e.name) + '">' +
               '<td class="rk">#' + (i + 1) + "</td>" +
               '<td><span class="on-dot' + (e.online ? "" : " off") + '"></span>' + esc(e.name) + "</td>" +
               '<td class="num">' + esc(fmtValue(e)) + "</td></tr>";
      }).join("") || '<tr><td colspan="3" class="empty">No entries yet for this period.</td></tr>';
    document.getElementById("board-count").textContent = num(entries.length) + " players";
  }

  function loadBoard() {
    var metric = document.getElementById("metric").value;
    var period = document.getElementById("period").value;
    currentMetric = metric;
    api("/api/leaderboard/" + encodeURIComponent(metric) + "?period=" + encodeURIComponent(period) + "&limit=50")
      .then(notError).then(function (data) {
        var entries = data.entries || [];
        renderPodium(entries);
        renderBoard(entries);
      }).catch(function (e) {
        renderBoard([]);
        renderPodium([]);
        status("board: " + e.message, true);
      });
  }

  var nameCache = {};

  function rememberNames(players) {
    (players || []).forEach(function (p) {
      if (p.name && p.uuid) nameCache[p.name.toLowerCase()] = p.uuid;
    });
  }

  function findUuid(name) {
    return api("/api/players?limit=100").then(notError).then(function (data) {
      rememberNames(data.players);
      return nameCache[name.toLowerCase()] || null;
    });
  }

  function stat(k, v) {
    return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + "</div></div>";
  }
  function favCard(ico, t, d, count) {
    return '<div class="fav"><span class="ico">' + ico + "</span><span>" +
           '<span class="t">' + esc(t) + "</span><br />" +
           '<span class="d">' + esc(d) + (count ? ' <small>(' + num(count) + ")</small>" : "") + "</span></span></div>";
  }

  function showProfile(name) {
    var box = document.getElementById("profile");
    box.classList.add("show");
    box.innerHTML = '<div class="profile-card"><div class="profile-sub">Looking up ' + esc(name) + "...</div></div>";
    findUuid(name).then(function (uuid) {
      if (!uuid) throw new Error("player not found");
      return api("/api/player/" + uuid + "/summary").then(notError);
    }).then(function (p) {
      var a = p.analytics || {};
      var c = p.combat || {};
      var mv = p.movement || {};
      var ac = p.activity || {};
      var fav = p.favorites || {};
      box.innerHTML =
        '<div class="profile-card">' +
        '<div class="profile-head">' +
        '<span class="pname">' + esc(p.name) + "</span>" +
        '<span class="badge' + (p.online ? " on" : "") + '">' + (p.online ? "online" : "offline") + "</span>" +
        '<span class="badge">rank #' + esc(a.rank_playtime > 0 ? a.rank_playtime : "-") + " playtime</span>" +
        "</div>" +
        '<div class="profile-sub">First seen ' + esc(prettyDate(a.first_seen)) +
        " &middot; last seen " + esc(prettyDate(a.last_seen)) + "</div>" +
        '<div class="stat-grid">' +
        stat("Playtime", a.playtime_formatted || dur(a.playtime_seconds)) +
        stat("Sessions", num(a.sessions)) +
        stat("K/D ratio", Number(a.kdr || 0).toFixed(2)) +
        stat("Kills", num((c.player_kills || 0) + (c.mob_kills || 0))) +
        stat("Deaths", num(c.deaths)) +
        stat("Blocks mined", num(ac.blocks_mined)) +
        stat("Items crafted", num(ac.items_crafted)) +
        stat("Distance", (Number(mv.total_distance_km) || 0).toFixed(1) + " km") +
        stat("Longest session", dur(a.longest_session_seconds)) +
        stat("Active time", dur(a.active_seconds)) +
        "</div>" +
        '<div class="fav-row">' +
        favCard("\u26CF", "Favorite block", prettyId(fav.block), fav.block_count) +
        favCard("\u2694", "Most killed", prettyId(fav.mob), fav.mob_count) +
        favCard("\uD83C\uDF92", "Most used item", prettyId(fav.item), fav.item_count) +
        "</div></div>";
      status("live", false);
    }).catch(function (e) {
      box.innerHTML =
        '<div class="profile-card"><div class="profile-sub">Could not find "' +
        esc(name) + '" (' + esc(e.message) + ").</div></div>";
    });
  }

  function loadLive() {
    api("/api/players?limit=50&online_only=true").then(notError).then(function (data) {
      rememberNames(data.players);
      var players = data.players || [];
      document.getElementById("live-count").textContent = num(players.length) + " online";
      var grid = document.getElementById("live-grid");
      if (!players.length) {
        grid.innerHTML = '<div class="empty">Nobody is online right now.</div>';
        return;
      }
      grid.innerHTML = players.map(function (p) {
        return '<div class="pcard" data-name="' + esc(p.name) + '">' +
               '<div class="top"><span class="on-dot"></span><span class="nm">' + esc(p.name) +
               '</span><span class="st">online</span></div>' +
               '<div class="row"><span>view stats</span><b>click</b></div></div>';
      }).join("");
      status("live", false);
    }).catch(function () {
      document.getElementById("live-grid").innerHTML =
        '<div class="empty">Live player list unavailable.</div>';
    });
  }

  document.getElementById("metric").value = currentMetric;
  if (CFG.leaderboard_period) document.getElementById("period").value = CFG.leaderboard_period;
  document.getElementById("metric").addEventListener("change", loadBoard);
  document.getElementById("period").addEventListener("change", loadBoard);
  document.getElementById("go").addEventListener("click", function () {
    var v = document.getElementById("q").value.trim();
    if (v) showProfile(v);
  });
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var v = this.value.trim();
      if (v) showProfile(v);
    }
  });
  document.getElementById("board").addEventListener("click", function (e) {
    var tr = e.target.closest("tr");
    if (tr && tr.dataset.name) showProfile(tr.dataset.name);
  });
  document.getElementById("live-grid").addEventListener("click", function (e) {
    var card = e.target.closest(".pcard");
    if (card && card.dataset.name) {
      document.getElementById("q").value = card.dataset.name;
      showProfile(card.dataset.name);
      document.getElementById("sec-lookup").scrollIntoView({ behavior: "smooth" });
    }
  });

  function refreshAll() {
    api("/api/server/summary").then(notError).then(function (s) {
      renderStrip(s);
      status("live", false);
    }).catch(function (e) { status("api: " + e.message, true); });
    loadBoard();
    loadLive();
  }

  refreshAll();
  setInterval(refreshAll, REFRESH);

  api("/api").then(notError).then(function (info) {
    document.getElementById("foot-ver").textContent = "v" + (info.version || "?") + " " + (info.platform || "");
  }).catch(function () {});
})();
</script>
</body>
</html>
