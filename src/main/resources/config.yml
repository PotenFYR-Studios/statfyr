# =========================================================
# StatFYR Configuration
# =========================================================

# DO NOT CHANGE THIS
config-version: 2

# =========================================================
# HTTP SERVER
# =========================================================
http:

  # REST API port
  port: 8080

  # Bind address
  #
  # 0.0.0.0 = public access
  # 127.0.0.1 = localhost only
  bind-address: "0.0.0.0"

  # Request timeout
  request-timeout-seconds: 15

  # Maximum request body size
  max-request-body-kb: 512

# =========================================================
# HTTPS / SSL
# =========================================================
https:

  # Enable HTTPS
  enabled: false

  # Java keystore path
  #
  # Generate using:
  #
  # keytool -genkeypair -alias statfyr ^
  # -keyalg RSA -keysize 2048 ^
  # -storetype JKS ^
  # -keystore keystore.jks ^
  # -validity 3650
  keystore-path: "plugins/statfyr/keystore.jks"

  # Keystore password
  #
  # Can also be overridden using:
  # STATFYR_KEYSTORE_PASSWORD
  keystore-password: "changeit"


# =========================================================
# COMPRESSION
# =========================================================
compression:

  # Enables gzip compression
  enabled: true

# =========================================================
# ASYNC
# =========================================================
async:

  # Enables async stat loading
  enabled: true

# =========================================================
# API DOCS
# =========================================================
docs:

  # Enable /api and /api/docs
  enabled: true

# =========================================================
# DEBUG
# =========================================================
debug: false

# =========================================================
# SECURITY
# =========================================================
security:

  # -------------------------------------------------------
  # API KEY AUTHENTICATION
  # -------------------------------------------------------

  # Enables Bearer authentication
  #
  # Authorization: Bearer your-key
  enable-api-key: false

  # API key
  #
  # Can also be overridden using:
  # STATFYR_API_KEY
  api-key: ""

  # -------------------------------------------------------
  # RATE LIMITING
  # -------------------------------------------------------

  # Enable rate limiting
  enable-rate-limit: true

  # Maximum requests per window
  rate-limit-requests: 120

  # Window duration in seconds
  rate-limit-window-seconds: 60

  # -------------------------------------------------------
  # CORS
  # -------------------------------------------------------

  # Enable CORS support
  enable-cors: true

  # Allowed browser origins
  #
  # "*" allows all origins
  allowed-origins:
    - "*"

  # -------------------------------------------------------
  # IP WHITELIST
  # -------------------------------------------------------

  # Restrict API access to specific IPs
  enable-ip-whitelist: false

  # Allowed IP addresses
  #
  # Example:
  #
  # allowed-ips:
  #   - "127.0.0.1"
  #   - "192.168.1.15"
  allowed-ips: []

# =========================================================
# QUERY LIMITS
# =========================================================
query:

  # Maximum allowed limit parameter
  max-limit: 100

# =========================================================
# PAGINATION
# =========================================================
pagination:

  # Default page size
  default-limit: 25

  # Maximum page size
  max-limit: 100

# =========================================================
# SORTING
# =========================================================
sorting:

  # Default sort order
  #
  # asc
  # desc
  default-order: "desc"

# =========================================================
# CACHE
# =========================================================
cache:

  # Cache lifetime in seconds
  ttl-seconds: 60

  # Cache refresh interval
  refresh-seconds: 10