name: Security Concern
description: Hardening guidance, security documentation gaps, or questions about security behavior
labels: [security]
title: "[Security]: "
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **Do not describe an exploitable vulnerability here.** This form is public. For actual vulnerabilities, use the confidential process in [SECURITY.md](../blob/master/SECURITY.md) (GitHub private vulnerability reporting).

        Use this form for public-facing security topics: the hardening documentation, deployment guidance, or how a security feature is *documented* to behave.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Hardening / deployment guidance is missing or unclear
        - Security behavior is documented incorrectly
        - Question about how a security feature works (API key, rate limit, CORS, IP whitelist, HTTPS)
        - Reverse proxy / HTTPS setup help
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should be clarified, corrected, or documented? Include the relevant config keys or docs page.
    validations:
      required: true
