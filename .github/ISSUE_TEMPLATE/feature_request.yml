name: Feature Request
description: Suggest an idea or new capability for Statfyr
labels: [enhancement]
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Ideas for new endpoints, config options, integrations, or behavior changes are welcome. Statfyr is a zero-dependency plugin, so proposals that can be built on the JDK and Bukkit API alone are the best fit.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what's missing or awkward about doing it today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? For API ideas, sketch the endpoint, params, and response shape.
      placeholder: |
        `GET /api/leaderboard/deaths?limit=10&online_only=true` returning ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or considered, and why they don't fit.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I checked the [documentation](https://statfyr.docs.potenfyr.in) and didn't find this feature
          required: true
        - label: I searched existing issues for duplicates
          required: true
