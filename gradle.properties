# =============================================================================
# Statfyr — Gradle properties
# =============================================================================

# Plugin version. Release CI overrides this with the pushed git tag
# (for example `-Pversion=1.2.0`) via the `version` project property.
version=1.0.0-BETA

# Maven coordinates of the published plugin.
group=in.potenfyr

# -----------------------------------------------------------------------------
# Build toolchain
# -----------------------------------------------------------------------------
# Statfyr targets Java 8 bytecode so a single artifact runs everywhere from
# Minecraft 1.8.x (Java 8) up to Minecraft 26.x (Java 25+). Modern JDKs can
# still compile it because we use javac's `--release 8` mode.
javaRelease=8

# Java version used to *run* Gradle + compile the build.
# Gradle 9.8+ supports Java 27, but any JDK 17+ works.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Compile-time Bukkit/Paper API
# -----------------------------------------------------------------------------
# Deliberately pinned to the oldest API Statfyr supports. We do NOT compile
# against 26.x because that would make the plugin link against classes and
# methods that do not exist on older servers. Newer API surface is reached
# reflectively at runtime instead.
# -----------------------------------------------------------------------------
paperApiVersion=1.16.5-R0.1-SNAPSHOT

# -----------------------------------------------------------------------------
# Plugin metadata used to expand plugin.yml at build time
# -----------------------------------------------------------------------------
pluginName=statfyr
pluginMain=in.potenfyr.statfyr.Statfyr
# The modern plugin.yml API version. Unknown to 1.8–1.12 servers (ignored)
# and required by 1.13+ servers.
pluginApiVersion=1.13
pluginAuthor=statfyr
pluginWebsite=https://github.com/PotenFYR-Studios/statfyr
pluginDescription=Exposes Minecraft player statistics via a built-in HTTP REST API
