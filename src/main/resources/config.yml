# =========================================================
# Statfyr Configuration
# =========================================================

# DO NOT CHANGE THIS
config-version: 1

# =========================================================
# HTTP SERVER
# =========================================================
http:

  # REST API port
  port: 8080

  # Bind address
  #
  # 0.0.0.0 = public access
  # 127.0.0.1 = localhost only
  bind-address: "0.0.0.0"

  # Request timeout
  request-timeout-seconds: 15

  # Maximum request body size
  max-request-body-kb: 512

# =========================================================
# HTTPS / SSL
# =========================================================
https:

  # Enable HTTPS
  enabled: false

  # Java keystore path
  #
  # Generate using:
  #
  # keytool -genkeypair -alias statfyr ^
  # -keyalg RSA -keysize 2048 ^
  # -storetype JKS ^
  # -keystore keystore.jks ^
  # -validity 3650
  keystore-path: "plugins/statfyr/keystore.jks"

  # Keystore password
  #
  # Can also be overridden using:
  # STATFYR_KEYSTORE_PASSWORD
  keystore-password: "changeit"


# =========================================================
# COMPRESSION
# =========================================================
compression:

  # Enables gzip compression
  enabled: true

# =========================================================
# ASYNC
# =========================================================
async:

  # Enables async stat loading
  enabled: true

# =========================================================
# API DOCS
# =========================================================
docs:

  # Enable /api and /api/docs
  enabled: true

# =========================================================
# DEBUG
# =========================================================
debug: false

# =========================================================
# SECURITY
# =========================================================
security:

  # -------------------------------------------------------
  # API KEY AUTHENTICATION
  # -------------------------------------------------------

  # Enables Bearer authentication
  #
  # Authorization: Bearer your-key
  enable-api-key: false

  # API key
  #
  # Can also be overridden using:
  # STATFYR_API_KEY
  api-key: ""

  # -------------------------------------------------------
  # RATE LIMITING
  # -------------------------------------------------------

  # Enable rate limiting
  enable-rate-limit: true

  # Maximum requests per window
  rate-limit-requests: 120

  # Window duration in seconds
  rate-limit-window-seconds: 60

  # -------------------------------------------------------
  # CORS
  # -------------------------------------------------------

  # Enable CORS support
  enable-cors: true

  # Allowed browser origins
  #
  # "*" allows all origins
  allowed-origins:
    - "*"

  # -------------------------------------------------------
  # IP WHITELIST
  # -------------------------------------------------------

  # Restrict API access to specific IPs
  enable-ip-whitelist: false

  # Allowed IP addresses
  #
  # Example:
  #
  # allowed-ips:
  #   - "127.0.0.1"
  #   - "192.168.1.15"
  allowed-ips: [ ]

# =========================================================
# QUERY LIMITS
# =========================================================
query:

  # Maximum allowed limit parameter
  max-limit: 100

# =========================================================
# PAGINATION
# =========================================================
pagination:

  # Default page size
  default-limit: 25

  # Maximum page size
  max-limit: 100

# =========================================================
# SORTING
# =========================================================
sorting:

  # Default sort order
  #
  # asc
  # desc
  default-order: "desc"

# =========================================================
# CACHE
# =========================================================
cache:

  # Cache lifetime in seconds
  ttl-seconds: 60

  # Cache refresh interval
  refresh-seconds: 10

# =========================================================
# DATA COLLECTION
# =========================================================
collection:

  # Master switch for background analytics collection
  enabled: true

  # How often online players are snapshotted into history (seconds).
  # Snapshots are appended to an append-only JSONL file, never a DB write
  # per event.
  snapshot-interval-seconds: 300

  # Track join/leave sessions (first seen, last seen, durations)
  session-tracking: true

  # Record a lightweight player activity timeline
  activity-timeline: true

  # AFK detection
  afk:
    enabled: true
    # Seconds of no movement/commands before a player counts as AFK
    threshold-seconds: 300

  # Privacy: metrics that should NOT be collected.
  # Example: [ "damage_dealt", "damage_taken" ]
  disabled-metrics: []

# =========================================================
# HISTORY / RETENTION
# =========================================================
history:

  # Enable persistent historical snapshots
  enabled: true

  # How long snapshots are kept.
  #   0   = unlimited
  #   30  = 30 days
  #   365 = one year
  retention-days: 365

# =========================================================
# LEADERBOARDS
# =========================================================
leaderboards:

  # Default period when none is supplied: daily | weekly | monthly | all_time
  default-period: all_time

  # Weekly reset (day + hour, server time)
  weekly-reset-day: MONDAY
  weekly-reset-hour: 0

  # Monthly reset day of month
  monthly-reset-day: 1

  # Minimum values required to appear on a leaderboard
  minimums:
    kdr:
      # Players need at least this many kills to rank on KDR
      kills: 10

# =========================================================
# INTEGRATIONS (all optional and independent)
# =========================================================
integrations:

  # PlaceholderAPI expansion
  placeholderapi:
    enabled: true

  # Vault economy analytics (read-only)
  vault:
    enabled: true

  # Discord webhook notifications
  discord:
    enabled: false
    webhook-url: ""
    # Minimum number of players for the peak milestone notification
    peak-milestone: 100
    events:
      weekly-leaderboard: true
      monthly-leaderboard: true
      peak-milestone: true
      new-player: false
      server-status: false

  # Prometheus /metrics exposition endpoint
  prometheus:
    enabled: false

# =========================================================
# NETWORK / MULTI-SERVER
# =========================================================
network:

  # Unique id for this server in a network (used by /api/network)
  server-id: "server-1"

  # Friendly name shown in network aggregation
  server-name: "Survival"

  # Optional: push this server's summary to a StatFYR hub.
  # Blank disables pushing. Example: "http://hub.example.com:8080"
  hub-url: ""

  # Shared secret used both when pushing and when accepting reports.
  # Sent/received in the X-StatFYR-Key header.
  report-key: ""

  # Accept reports from other servers at POST /api/network/report
  accept-reports: true

  # How often to push to the hub (seconds)
  report-interval-seconds: 60

  # How long a received report stays valid (seconds)
  report-ttl-seconds: 180

# =========================================================
# MILESTONES
# =========================================================
milestones:

  enabled: true

  # Broadcast milestones to the whole server
  broadcast: true

  # Player milestones (hours of playtime)
  playtime-hours: [ 10, 100 ]

  # Player milestones (kills)
  kills: [ 100 ]

  # Player milestones (blocks mined)
  blocks-mined: [ 1000 ]

  # Server milestones (unique players)
  unique-players: [ 100, 1000 ]

  # Server milestones (peak concurrent players)
  peak-players: [ 100 ]

# =========================================================
# COMMANDS
# =========================================================
commands:

  # Aliases for /statfyr (the bundled plugin.yml already provides /sf)
  aliases: [ sf ]